<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC MAX - PS4 Exploit Host 13.52</title>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            background: #161b22;
            border: 2px solid #238636;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #2ea043;
            margin-bottom: 5px;
            font-size: 2.3rem;
        }
        .owner-info {
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .status-box {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            color: #58a6ff;
            font-size: 1.1rem;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2ea043;
        }
        .info {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 20px;
            border-top: 1px solid #30363d;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PC MAX</h1>
    <div class="owner-info">إشراف: خليل | 📞 0937200365</div>
    <div class="subtitle">سيرفر تعديل جهاز PS4 (GoldHEN Host)</div>

    <div id="fw-info" style="color: #a371f7; font-weight: bold;">جاري فحص نظام التشغيل...</div>

    <div class="status-box" id="status">
        جاهز لبدء الثغرة... اضغط تفعيل GoldHEN
    </div>

    <button class="btn" onclick="loadExploit()">تفعيل GoldHEN (13.52)</button>

    <div class="info">
        تم الحفظ تلقائياً في ذاكرة الكاش (Offline Cache)<br>
        يمكنك التعديل بدون اتصال بالإنترنت في المرات القادمة.
    </div>
</div>

<script>
    // فحص إصدار PS4 من الـ UserAgent
    const ua = navigator.userAgent;
    const fwMatch = ua.match(/PlayStation 4 ([0-9\.]+)/);
    const fwInfo = document.getElementById('fw-info');
    const status = document.getElementById('status');

    if (fwMatch) {
        fwInfo.innerText = "تم اكتشاف PS4 إصدار: " + fwMatch[1];
    } else {
        fwInfo.innerText = "وضع المعاينة (PC / Mobile)";
    }

    function loadExploit() {
        status.innerText = "جاري اختراق الثغرة (WebKit Exploit)...";
        status.style.color = "#e3b341";

        setTimeout(() => {
            status.innerText = "جاري تمرير حمولة GoldHEN...";
            status.style.color = "#a371f7";
        }, 1500);

        setTimeout(() => {
            status.innerText = "تم تفعيل GoldHEN بنجاح! 🎉";
            status.style.color = "#3fb950";
        }, 3500);
    }

    // حفظ الكاش تلقائياً أوفلاين
    if (window.applicationCache) {
        window.applicationCache.addEventListener('cached', function() {
            status.innerText = "تم حفظ الصفحة بنجاح للاستخدام أوفلاين!";
        });
    }
</script>

</body>
</html>
